# 11-Sep: schedule/workflow_run DESHABILITADOS -- este workflow corría en un
# checkout de GitHub Actions que NUNCA tiene los datos reales (results.csv y
# predictions_*.csv están gitignored desde 01/08-Sep; solo quedan ~76 ficheros
# viejos congelados en el árbol de hace días, sin resultados.csv en absoluto).
# Eso hacía que el digest reportara "0 predicciones/24h" y una "vencidas sin
# resolver" fantasma (todo el histórico congelado sin match, ver
# feedback/incidente 11-Sep) mientras el pipeline real seguía funcionando con
# normalidad en el VPS. Movido a cron local (`0 20 * * *` en el crontab del
# VPS, mismo horario) que sí ve los ficheros reales. Se deja workflow_dispatch
# por si hace falta relanzar manualmente para depurar, pero NUNCA como fuente
# de verdad del digest diario.
name: Daily Digest (deshabilitado -- ver cron local)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check time window (only for workflow_run trigger)
        if: github.event_name == 'workflow_run'
        run: |
          HOUR=$(date -u +%H)
          echo "Hora UTC actual: $HOUR"
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 22 ]; then
            echo "DENTRO de la ventana 07-22 UTC, se enviará el digest."
            echo "SEND_DIGEST=true" >> $GITHUB_ENV
          else
            echo "FUERA de la ventana 07-22 UTC (hora=$HOUR), se omite."
            echo "SEND_DIGEST=false" >> $GITHUB_ENV
          fi

      - name: Set send flag for schedule/dispatch
        if: github.event_name != 'workflow_run'
        run: echo "SEND_DIGEST=true" >> $GITHUB_ENV

      - name: Checkout
        if: env.SEND_DIGEST == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SEND_DIGEST == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: env.SEND_DIGEST == 'true'
        run: pip install -r requirements.txt

      - name: Send daily digest
        if: env.SEND_DIGEST == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python shadow_digest.py
